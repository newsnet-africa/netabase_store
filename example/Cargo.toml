[package]
name = "example"
version = "0.1.0"
edition = "2024"
publish = false


[dependencies]
netabase_store = { path = ".." }
netabase_macros = { path = "../netabase_macros", version = "0.1.3" }
netabase = { path = "../../netabase" }
redb = "3.1.0"
strum = { version = "0.27.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
derive_more = { version = "2.1.0", features = ["display", "try_into", "from", "into"] }
from = "0.1.4"
clap = { version = "4.5.23", features = ["derive"] }
tempfile = "3.15"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }
rand = "0.9.2"
hex = "0.4"
serde_json = "1.0.149"

[features]
default = []
# Enable sequential tests that depend on file artifacts from other tests
# Run with: cargo test --features sequential-tests -- --test-threads=1
sequential-tests = []

[[bench]]
name = "crud"
path = "benches/crud.rs"
harness = false

[[bench]]
name = "stress"
path = "benches/stress.rs"
harness = false

[[bench]]
name = "record_store"
path = "benches/record_store.rs"
harness = false

[[bench]]
name = "minimal"
path = "benches/minimal.rs"
harness = false

[[bench]]
name = "iterators"
path = "benches/iterators.rs"
harness = false

# Test ordering: schema_export must run before schema_import
# Tests run in alphabetical order
[[test]]
name = "0_schema_export"
path = "tests/schema_export.rs"

[[test]]
name = "1_schema_import"
path = "tests/schema_import.rs"

[[test]]
name = "macro_test"
path = "tests/macro_test.rs"

[[test]]
name = "migration_logic"
path = "tests/migration_logic.rs"

[[test]]
name = "content_addressed_test"
path = "tests/content_addressed_test.rs"

# Examples demonstrating new API features
[[example]]
name = "selective_subscriptions"
path = "examples/selective_subscriptions.rs"

[[example]]
name = "merkle_sync"
path = "examples/merkle_sync.rs"
serde_json = "1.0"
