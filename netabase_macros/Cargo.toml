[package]
name = "netabase_macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true


[dependencies]
darling = "0.23.0"
quote = "1.0.44"
syn = { version = "2.0.117", features = ["parsing", "visit"] }
proc-macro2 = "1.0"
heck = "0.5.0"
rkyv = { version = "0.8.15", features = ["alloc", "bytecheck"] }
proc_macro_flow = { path = "../proc_macro_flow" }
