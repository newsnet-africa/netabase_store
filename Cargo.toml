[package]
name = "netabase"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
  "rewrite_macros/",
  "proc_macro_flow/",
  "proc_macro_flow/derive/",
]

[dependencies]
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
redb = "2.0"
thiserror = "1.0"
libp2p = { version = "0.53", features = ["kad"] }
rkyv = { version = "0.8.15", features = ["bytecheck", "alloc"] }
rewrite_macros = { path = "rewrite_macros" }
proc_macro_flow = { path = "proc_macro_flow" }

[dev-dependencies]
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
