[package]
name = "netabase_store"
version = "0.1.0"
edition = "2024"

[features]
default = ["secondary_keys", "relational_keys", "blobs", "repository", "migration", "libp2p", "subscriptions"]
secondary_keys = []
relational_keys = []
blobs = []
repository = []
migration = ["dep:toml"]
libp2p = ["dep:libp2p"]
subscriptions = []

[dependencies]
redb = "3.1.0"
strum = { version = "0.27.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
thiserror = "2.0.17"
rand = "0.9.2"
derive_more = { version = "2.1.0", features = ["display", "try_into", "from"] }
toml = { version = "0.9.10", optional = true }
rustc-hash = "2.1"
sha2 = "0.10"
tempfile = "3.15"
netabase_macros = { path = "./netabase_macros" }
libp2p = { version = "0.56.0", features = ["kad", "serde"], optional = true }
clap = { version = "4.5", features = ["derive"] }
rs_merkle = "1.5.0"
hex = "0.4"
bincode = "1.3"

[workspace]
members = [
  "netabase_macros",
  "boilerplate"
]

[dev-dependencies]
netabase_store_examples = { path = "./boilerplate" }
derive_more = { version = "2.1.0", features = ["display", "try_into", "from"] }

